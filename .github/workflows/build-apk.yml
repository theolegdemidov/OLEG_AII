name: Build Android APK
# Запуск: вкладка Actions -> Build Android APK -> Run workflow (кнопка справа).
# Через 5-10 минут APK появится в разделе Releases (справа на главной странице репозитория): открой его с телефона и скачай.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p mobile assembleDebug --stacktrace
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/app/build/outputs/apk/debug/app-debug.apk SocialD.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk SocialD.apk --target "${{ github.sha }}" \
            --title "SocialD для Android" \
            --notes "Скачай SocialD.apk на телефон и установи. Если Android спросит про установку из неизвестных источников, разреши для браузера."
      - uses: actions/upload-artifact@v4
        with:
          name: socialD-debug-apk
          path: SocialD.apk
