name: Build Android APK
# Сборка APK в облаке GitHub: Android Studio на ноутбуке не нужна.
# Запуск: вкладка Actions -> Build Android APK -> Run workflow. Готовый файл: раздел Artifacts внизу страницы запуска.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p mobile assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: oleg-ai-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
